# One-click deploy on Render (https://render.com). SQLite lives on a
# persistent disk so sessions survive restarts and deploys.
services:
  - type: web
    name: heardit
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --worker-class gthread --timeout 300 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DB_PATH
        value: /var/data/heardit.db
      - key: AUDIO_DIR
        value: /var/data/audio
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Money locks — set these before anyone else can reach the site
      # Set this in the Render dashboard, not here — this file is public.
      # Empty means ANY Google account can sign in and spend your API credits.
      - key: ALLOWED_EMAILS
        sync: false
      - key: OWNER_EMAILS
        sync: false
      - key: PROMO_SEED
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: YTDLP_PROXY
        sync: false
      - key: MONTHLY_BUDGET_MINUTES
        value: "600"
